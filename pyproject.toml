[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piwpct"
version = "0.1.0"
description = "Physics-Impact Weighted Working-Point Conformal Training (PI-WPCT) for LHC Jet Flavour Tagging"
readme = "README.md"
authors = [
    { name = "R Kiran" },
    { name = "Kurt Sony Rebello" },
    { name = "Adityan Rajesh P" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "uproot>=5.3,<6",
    "awkward>=2.6,<3",
]

[project.optional-dependencies]
# Generic local-development convenience only. Astra installs its CUDA build separately.
training = [
    "torch>=2.0.0",
]
gbt = [
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0",
]
api = [
    "fastapi",
    "pydantic",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
