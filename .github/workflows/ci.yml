name: PI-WPCT CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/

    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports src/

    - name: Generate canonical pilot split
      run: |
        python scripts/build_splits.py --pilot --output-dir data/splits --seed 42

    - name: Run pre-training diagnostic check
      run: |
        python scripts/run_pretraining_diagnostic.py --pilot --config configs/experiment.yaml

    - name: Run test suite with pytest
      run: |
        pytest tests/ -v --cov=src/piwpct --cov-report=term-missing
