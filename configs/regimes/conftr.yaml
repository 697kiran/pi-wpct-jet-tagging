# ConfTr Regime (Differentiable Conformal Training per Stutz et al., ICLR 2022)
regime: "conftr"
description: "Differentiable conformal training using smooth coverage and set-size objectives"
loss:
  type: "conftr"
  alpha: 0.10             # target miscoverage rate
  temperature: 0.1        # sigmoid relaxation temperature
  smooth_factor: 10.0
  size_penalty_weight: 0.1
  coverage_penalty_weight: 1.0
optimizer:
  type: "adamw"
  lr: 0.001
  weight_decay: 1e-4
scheduler:
  type: "cosine"
  eta_min: 1e-5
post_hoc_calibration: null
conformal_calibration: true
conformal_method: "mondrian"
