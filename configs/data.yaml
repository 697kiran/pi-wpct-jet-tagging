# Portable roots. CLI values override these; environment variables are the next
# fallback, followed by repository-relative defaults. Leave prepared_data_root
# unset until a deliberate conversion destination is selected.
data:
  raw_data_root: null
  prepared_data_root: null
  output_root: null

  # The conversion CLI requires an explicit --target-mode. JetClass process
  # labels are not the project's light/charm/b flavour labels.
  particle_cap: 128
  chunk_size: 2048
  calibration_fraction: 0.10
  seed: 42

  # Synthetic pilot parameters (only used with explicit --pilot).
  pilot:
    enabled: true
    n_samples: 12000
    class_ratio:
      light: 4
      charm: 1
      b: 1
    num_particles: 32

  # Current PI-WPCT working-point objective is flavour-specific. Values remain
  # available for flavour-tagging manifests with valid annotations.
  yields:
    light: 100000.0
    charm: 25000.0
    b: 25000.0

  dataloader:
    batch_size: 256
    num_workers: 0
    pin_memory: false
    shuffle_buffer_size: 8192
    drop_last: false

  split_fractions:
    train: 0.60
    validation: 0.15
    calibration: 0.10
    test: 0.15
